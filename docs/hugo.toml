baseURL = 'https://epub.raitucarp.name/'
defaultContentLanguage = 'en'
title = 'epub — Go Library for Reading, Writing & Editing EPUB Publications'

[params]
  version = 'v0.5.1'
  description = 'High-performance, idiomatic Go library for reading, creating, and editing EPUB 2 and EPUB 3 publications.'
  author = 'Raitucarp'
  github = 'https://github.com/raitucarp/epub'
  godoc = 'https://pkg.go.dev/github.com/raitucarp/epub'
  kofi = 'https://ko-fi.com/raitucarp'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github-dark'
    guessSyntax = true
    lineNos = false

